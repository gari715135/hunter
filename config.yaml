# ./config.yaml

bollinger_analysis:
  s3:
    bucket: "hunt-data-store"
    prefix: "sysdig/monitor/prometheusV5/conformed"
    metrics:
      - "sysdig_connection_net_out_bytes"
      - "sysdig_connection_net_connection_out_count"
    cluster: "eks-dev-k8s-west-2"
    dt: "20260821"
  analysis:
    holdout_days: 30
    bollinger_window: "30D"
    bollinger_std: 2
    poly_degrees: [1, 2, 3, 4, 8, 11, 14]

prometheus:
  url: "https://us2.app.sysdig.com"
  metrics:
    - sysdig_connection_net_in_bytes
    - sysdig_connection_net_out_bytes
    - sysdig_connection_net_connection_in_count
    - sysdig_connection_net_connection_out_count

  # Per-cluster queries add kube_namespace_name!="<ns>" for each entry.
  # "" drops series with no namespace label (host-level traffic).
  exclude_namespaces:
    - ""
    # - amazon-guardduty
    # - domino-platform
    # - dynatrace
    # - istio-system
    # - kube-system
    # - monitoring
    # - redis
    # - splunk
    # - sysdig-agent
    # - traceable-ai

  # Per-cluster queries add container_name!="<name>" for each entry.
  exclude_containers:
    - istio-proxy

  # Server-side aggregation: query becomes `<op> by (<by>) (<selector>)`,
  # or `<op> by (<by>) (<fn>(<selector>[<step>s]))` when a time function is set below.
  # Verified exact vs. the raw sum (difference ~1e-10 relative) on 2026-10-14.
  # Only applies to metrics listed here; others are fetched raw.
  aggregation:
    op: sum
    metrics:
      - sysdig_connection_net_in_bytes
      - sysdig_connection_net_out_bytes
      - sysdig_connection_net_connection_in_count
      - sysdig_connection_net_connection_out_count
    # Optional per-metric time function applied to the selector before `op by`:
    #   <op> by (<by>) (<fn>(<selector>[<step>s]))
    # The window always equals the query step, so consecutive windows tile time exactly.
    # Sysdig stores ~1s readings and the plain 10s value is their AVERAGE; sum_over_time
    # gives true bytes per step. Validated 2026-10-20: plain == avg_over_time[10s],
    # 1m sum == six 10s sums (no boundary double-count), 10s sums are whole numbers.
    # The 1s readings are only retained briefly, so this must run at fetch time (no backfill).
    # The connection_*_count metrics are levels (currently established), so they keep the plain value.
    time_functions:
      sysdig_connection_net_in_bytes: sum_over_time
      sysdig_connection_net_out_bytes: sum_over_time
    by:
      # Dmitri's required fields (__name__ is re-added by the ingestor; time comes from samples)
      - agent_tag_Cloud_Platform
      - agent_tag_TIAA_Environment
      - agent_tag_TIAA_Network_Segment
      - agent_tag_cluster
      - client_ip
      - server_ip
      - remote_service
      - protocol
      - cmd_line
      - program_name
      - container_id
      - container_image
      - container_image_digest
      - container_image_id
      - container_name
      - container_label_io_kubernetes_pod_name
      - container_label_io_kubernetes_pod_namespace
      - host_instance_id
      - kube_cluster_name
      - kube_namespace_name
      - kube_node_name
      - kube_pod_name
      - kube_workload_name
      - kube_workload_type
      # Additional IP fields
      - kube_pod_internal_ip
      - net_client_ip
      - net_server_ip
      - net_local_endpoint
      - net_remote_endpoint
      - local_service
      - net_local_service
      - net_remote_service
      # Context for peer grouping / triage (determined by pod, node or image: no extra series)
      - container_image_repo
      - kube_workload_label_app_cmdb_id
      - kube_workload_label_app_family
      - kube_workload_label_platform_short_name
      - kube_node_label_topology_kubernetes_io_zone
      - kube_node_label_karpenter_sh_nodepool

storage:
  # backend: "s3"  # Options: "local" or "s3"
  backend: "local"
  local:
    # parent_directory: "/Users/arisgia/Documents/HUNT/"
    parent_directory: "/Users/arisgia/Documents/hunt-cpy/zero-day-kubernetes-threat-detection/data"
    base_path: "hunt-data-store/sysdig/monitor/prometheus"
  s3:
    base_path: "s3://hunt-data-store/sysdig/monitor/prometheusV7"

run:
  num_workers: 5
  fetch_all_clusters_at_once: false

logging:
  app: "hunt-fetch"  # "app" field on every JSON event
  version: "1.0.0"   # "version" field on every JSON event; bump on each release (APP_VERSION env var overrides)
  root_level: "INFO"
  console_level: "INFO"
  file_level: "DEBUG"

  components:
    config: "DEBUG"
    client: "DEBUG"
    ingestor: "DEBUG"
    orchestrator: "DEBUG"
    storage: "DEBUG"

  handlers:
    file:
      path: "/opt/hunt/logs/beacons.log"  # TEMPORARY: only file the Splunk forwarder tails (was logs/fetch_data/app.log)
      max_bytes: 52428800  # 50MB, same as detect records (shared file)
      backup_count: 5

    error_file:
      path: "logs/fetch_data/error.log"
      max_bytes: 5242880  # 5MB
      backup_count: 3

    console:
      enabled: true
      colored: true  # Will only apply when storage.backend == "local"

    # Structured (same format as the files) to stdout, for container log collection (e.g. EKS).
    # Off on EC2, where the Splunk forwarder tails the mounted log directory.
    stdout:
      enabled: false

  format:
    type: "json"  # "json" (one JSON object per line, for Splunk) or "kv" (legacy key=value, uses `detailed`)
    detailed: "timestamp=%(asctime)s level=%(levelname)s logger=%(name)s correlation_id=%(correlation_id)s job_id=%(job_id)s thread=%(threadName)s message=\"%(message)s\""
    console: "%(asctime)s [%(levelname)-8s] %(name)-30s | %(message)s"
# Logging for scripts/detect_beacons.py: same JSON event format as `logging`, separate app/files.
# BEACON_LOG_DIR / BEACON_LOG_FILE override the directory / records filename.
beacon_logging:
  app: "hunt-beacon"
  version: "1.0.0"
  root_level: "INFO"
  console_level: "INFO"
  file_level: "DEBUG"

  components:
    config: "DEBUG"
    detector: "DEBUG"
    records: "INFO"

  handlers:
    file:
      path: "logs/detect_beacons/app.log"
      max_bytes: 10485760  # 10MB
      backup_count: 3

    error_file:
      path: "logs/detect_beacons/error.log"
      max_bytes: 5242880  # 5MB
      backup_count: 3

    # One beacon_candidate event per line, nothing else (for the Splunk forwarder).
    records:
      path: "/opt/hunt/logs/beacons.log"  # TEMPORARY: only file the Splunk forwarder tails (was logs/detect_beacons/beacons.log)
      max_bytes: 52428800  # 50MB
      backup_count: 5

    console:
      enabled: true
      colored: true

    stdout:
      enabled: false

  format:
    type: "json"
    console: "%(asctime)s [%(levelname)-8s] %(name)-30s | %(message)s"
