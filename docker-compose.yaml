# docker-compose.yaml
services:
  prometheus-fetcher:
    image: hunt-data-fetch:1.0.0
    container_name: hunt-prometheus-fetcher
    network_mode: host
    volumes:
      # Application data
      # - /opt/hunt/data:/data
      # Config — edited by any team member, not tied to one user
      - /opt/hunt/config.yaml:/app/config.yaml:ro
      # Logs
      - /opt/hunt/logs:/app/logs
    env_file:
      - .env
    restart: on-failure:3